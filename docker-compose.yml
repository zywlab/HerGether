version: '3.8'

services:
  ocr-api:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    container_name: base44-ocr-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production
    volumes:
      - ./logs:/var/log
    restart: unless-stopped
    networks:
      - base44-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: base44-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - ocr-api
    restart: unless-stopped
    networks:
      - base44-network

networks:
  base44-network:
    driver: bridge

volumes:
  logs:
    driver: local
